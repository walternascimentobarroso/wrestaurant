# Deploy do frontend Next.js para produção na Vercel.
#
# Domínio alvo: wrestaurant.amoracafe.pt (configurar em Vercel → Settings → Domains)
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — https://vercel.com/account/tokens
#   VERCEL_ORG_ID     — .vercel/project.json após `vercel link` ou Team/Project Settings
#   VERCEL_PROJECT_ID — .vercel/project.json após `vercel link` ou Project Settings
#
# Variáveis de ambiente (Vercel → Project → Settings → Environment Variables):
#   NEXT_PUBLIC_ADMIN_PASSWORD — senha do painel /admin
#   NEXT_PUBLIC_API_URL        — opcional até o backend existir
#
# Importante: desative o deploy automático por Git na Vercel para evitar deploy duplo
# (Settings → Git → desconectar ou ignorar o repositório).

name: Deploy Frontend (Vercel)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-frontend-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Production → wrestaurant.amoracafe.pt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
